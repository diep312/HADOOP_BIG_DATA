hadoop.root.logger=INFO,console
log4j.rootLogger=${hadoop.root.logger}
log4j.threshold=ALL

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yy/MM/dd HH:mm:ss} %p %c{2}: %m%n

# Bớt log rườm rà của LocalJobRunner, giữ lại tiến độ job và bảng Counters
log4j.logger.org.apache.hadoop.util.NativeCodeLoader=ERROR
log4j.logger.org.apache.hadoop.mapred.MapTask=WARN
log4j.logger.org.apache.hadoop.mapred.Task=WARN
log4j.logger.org.apache.hadoop.mapred.Merger=WARN
log4j.logger.org.apache.hadoop.mapred.LocalJobRunner=WARN
log4j.logger.org.apache.hadoop.mapreduce.task.reduce=WARN
log4j.logger.org.apache.hadoop.mapreduce.lib.output=WARN
log4j.logger.org.apache.hadoop.conf.Configuration.deprecation=WARN
log4j.logger.org.apache.hadoop.metrics2=ERROR
