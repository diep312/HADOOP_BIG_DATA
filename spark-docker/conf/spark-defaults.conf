# Cau hinh mac dinh cho moi spark-submit / pyspark chay trong cac container
spark.master                     spark://spark-master:7077
spark.driver.memory              512m
# Phai <= bo nho worker (--memory 1536m trong compose.yaml), neu khong job se cho mai
spark.executor.memory            1g
spark.eventLog.enabled           true
spark.eventLog.dir               file:/opt/spark/spark-events
spark.history.fs.logDirectory    file:/opt/spark/spark-events
spark.sql.shuffle.partitions     8
