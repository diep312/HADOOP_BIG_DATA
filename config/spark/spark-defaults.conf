# ===== SPARK_HOME/conf/spark-defaults.conf =====

# Trinh quan ly tai nguyen mac dinh: YARN cua Hadoop 3.3.6
# (ghi de khi chay thu nhanh bang: --master "local[*]")
spark.master                       yarn
spark.submit.deployMode            client

# Tai nguyen cap cho driver va executor (khop tran 4096 MB cua YARN)
spark.driver.memory                1g
spark.executor.memory              2g
spark.executor.cores               2
spark.executor.instances           2

# Ghi log su kien len HDFS de History Server doc lai
spark.eventLog.enabled             true
spark.eventLog.dir                 hdfs://localhost:9000/spark-logs
spark.history.fs.logDirectory      hdfs://localhost:9000/spark-logs
spark.history.ui.port              18080

# Nap san jar Spark len HDFS, tranh upload lai ~300 MB moi lan submit
spark.yarn.archive                 hdfs://localhost:9000/spark-jars/spark-libs.jar

# Serializer nhanh hon mac dinh Java
spark.serializer                   org.apache.spark.serializer.KryoSerializer

# So partition mac dinh khi shuffle (mac dinh 200 la qua nhieu cho 1 node)
spark.sql.shuffle.partitions       8

# Adaptive Query Execution
spark.sql.adaptive.enabled         true
